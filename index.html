

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الرضي _ مكتبة سليمان</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a1222;
            --secondary-color: #e67e22;
            --accent-color: #f39c12;
            --bg-light: #f4f6f9;
            --text-color: #333333;
            --white: #ffffff;
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-color); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        .hero { background: linear-gradient(135deg, var(--primary-color), #2d1b3f); color: var(--white); padding: 80px 20px 60px; text-align: center; position: relative; overflow: hidden; }
        .hero-content { max-width: 800px; margin: 0 auto; position: relative; z-index: 2; }
        .hero h1 { font-size: 2.5rem; font-weight: 900; margin-bottom: 15px; color: var(--white); }
        .hero h1 span { color: var(--secondary-color); }
        .hero p { font-size: 1.1rem; color: #dcdde1; margin-bottom: 25px; }
        .hero-badge { display: inline-block; background: rgba(230, 126, 34, 0.2); color: var(--accent-color); padding: 8px 20px; border-radius: 30px; font-weight: 700; margin-bottom: 20px; border: 1px solid rgba(230, 126, 34, 0.4); }
        .stats-section { background-color: var(--white); padding: 50px 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); margin-bottom: 40px; }
        .stats-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 30px; }
        .stat-item { text-align: center; padding: 20px; border-radius: 12px; background: var(--bg-light); transition: var(--transition); }
        .stat-item:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .stat-item i { font-size: 2.2rem; color: var(--secondary-color); margin-bottom: 15px; }
        .stat-item h3 { font-size: 1.2rem; color: var(--primary-color); margin-bottom: 8px; font-weight: 700; }
        .stat-item p { font-size: 0.9rem; color: #666; }
        .team-section { max-width: 1200px; margin: 0 auto 50px auto; padding: 0 20px; text-align: center; }
        .section-title { font-size: 2rem; font-weight: 800; color: var(--primary-color); margin-bottom: 10px; }
        .section-subtitle { color: #666; margin-bottom: 35px; font-size: 1rem; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; }
        .team-card { background: var(--white); padding: 30px 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: var(--transition); border-top: 4px solid var(--secondary-color); }
        .team-card:hover { transform: translateY(-8px); box-shadow: 0 12px 25px rgba(0,0,0,0.1); }
        .team-avatar { width: 75px; height: 75px; background: rgba(230, 126, 34, 0.1); color: var(--secondary-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 15px; overflow: hidden; border: 2px solid var(--secondary-color); }
        .team-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .team-card h3 { font-size: 1.3rem; color: var(--primary-color); margin-bottom: 5px; font-weight: 700; }
        .team-card p { color: #777; font-size: 0.9rem; }
        .contact-container { max-width: 800px; margin: 0 auto 50px auto; background: var(--white); padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
        .contact-form .form-group { margin-bottom: 20px; }
        .contact-form label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--primary-color); font-size: 0.95rem; }
        .contact-form input[type="text"], .contact-form select, .contact-form textarea { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; outline: none; transition: var(--transition); background-color: var(--white); }
        .contact-form textarea { height: 130px; resize: vertical; }
        .upload-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .upload-card { border: 2px dashed #cbd5e1; padding: 15px; border-radius: 10px; text-align: center; background: #fafafa; cursor: pointer; transition: var(--transition); }
        .upload-card i { font-size: 1.6rem; color: var(--secondary-color); margin-bottom: 6px; }
        .upload-card p { font-size: 0.85rem; color: #444; font-weight: 600; }
        .selected-file-info { margin-top: 8px; font-size: 0.85rem; color: #27ae60; font-weight: 700; }
        .contact-form button[type="submit"] { background-color: var(--secondary-color); color: var(--white); border: none; padding: 14px 30px; border-radius: 10px; font-size: 1.05rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
        .status-message { margin-top: 20px; padding: 20px; border-radius: 12px; text-align: center; font-weight: 700; display: none; }
        .status-message.success { display: block; background: #d4edda; color: #155724; border: 1px solid #b1dfbb; }
        footer { background-color: #110c18; color: var(--white); padding: 50px 20px 20px; border-top: 4px solid var(--secondary-color); text-align: center; }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-content">
            <h1>مركز الرضي <span>مكتبة سليمان</span></h1>
            <p>نقدم أفضل خدمات طباعة وتصوير المستندات والبحوث الطلابية.</p>
        </div>
    </section>

    <section class="team-section">
        <h2 class="section-title">فريق العمل</h2>
        <div class="team-grid">
            <div class="team-card">
                <div class="team-avatar"><i class="fa-solid fa-user-tie"></i></div>
                <h3>سليمان</h3>
                <p>إدارة المركز والمكتبة</p>
            </div>
            <div class="team-card">
                <div class="team-avatar"><img src="50526.png" alt="آدم"></div>
                <h3>آدم</h3>
                <p>قسم الطباعة والتصوير</p>
            </div>
            <div class="team-card">
                <div class="team-avatar"><i class="fa-solid fa-user-pen"></i></div>
                <h3>جواهر</h3>
                <p>كتابة وبحوث الطلاب</p>
            </div>
            <div class="team-card">
                <div class="team-avatar"><img src="45815.jpg" alt="محمود"></div>
                <h3>محمود</h3>
                <p>الدعم الفني والتقني</p>
            </div>
        </div>
    </section>

    <div class="contact-container" id="contact">
        <form class="contact-form" id="contactForm" action="https://formsubmit.co/alshftmhmwd9@gmail.com" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="_subject" value="طلب جديد">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" name="الاسم" required>
            </div>
            <button type="submit" id="submitBtn">إرسال البيانات</button>
            <div id="statusMessage" class="status-message">تم إرسال طلبك بنجاح!</div>
        </form>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const statusMessage = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            submitBtn.disabled = true;
            
            fetch(form.action, { method: 'POST', body: formData, headers: { 'Accept': 'application/json' } })
            .then(() => {
                statusMessage.classList.add('success');
                form.reset();
                setTimeout(() => statusMessage.classList.remove('success'), 5000);
            })
            .catch(() => {
                statusMessage.classList.add('success');
                setTimeout(() => statusMessage.classList.remove('success'), 5000);
            })
            .finally(() => submitBtn.disabled = false);
        });
    </script>
</body>
</html>
